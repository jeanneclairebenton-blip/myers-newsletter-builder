function pickTemplate(title, description, host) {
  const text = `${title} ${description} ${host}`.toLowerCase();
  if (/poker|social|happy hour|party|legacy|celebration|baby shower|fireside/i.test(text)) return "spotlight";
  if (/meet.*work|co-?working|in-?person/i.test(text)) return "network";
  if (/101|201|301|102|training|mastering|course|class|learn/i.test(text)) return "blueprint";
  if (/ask me|ama|q\s*&\s*a/i.test(text)) return "prestige";
  if (/marketing|pipeline|strategy|brand|distribution/i.test(text)) return "noir";
  return "executive";
}

function drawGoldCorners(ctx, w, h, size) {
  ctx.strokeStyle = GOLD; ctx.lineWidth = 2.5;
  const s = size;
  ctx.beginPath(); ctx.moveTo(24, 24+s); ctx.lineTo(24, 24); ctx.lineTo(24+s, 24); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(w-24-s, 24); ctx.lineTo(w-24, 24); ctx.lineTo(w-24, 24+s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(24, h-24-s); ctx.lineTo(24, h-24); ctx.lineTo(24+s, h-24); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(w-24-s, h-24); ctx.lineTo(w-24, h-24); ctx.lineTo(w-24, h-24-s); ctx.stroke();
}

function drawDiamondPattern(ctx, w, h, color, spacing, sz) {
  ctx.strokeStyle = color; ctx.lineWidth = 0.5;
  for (let x = 0; x < w; x += spacing) {
    for (let y = 0; y < h; y += spacing) {
      ctx.beginPath();
      ctx.moveTo(x, y-sz); ctx.lineTo(x+sz, y); ctx.lineTo(x, y+sz); ctx.lineTo(x-sz, y);
      ctx.closePath(); ctx.stroke();
    }
  }
}

function drawNetworkDots(ctx, w, h) {
  const dots = [];
  for (let i = 0; i < 35; i++) dots.push({x: Math.random()*w, y: Math.random()*h, r: Math.random()*2.5+1});
  ctx.strokeStyle = GOLD+"18"; ctx.lineWidth = 0.8;
  for (let i = 0; i < dots.length; i++) {
    for (let j = i+1; j < dots.length; j++) {
      const dx = dots[i].x-dots[j].x, dy = dots[i].y-dots[j].y;
      if (Math.sqrt(dx*dx+dy*dy) < 160) { ctx.beginPath(); ctx.moveTo(dots[i].x, dots[i].y); ctx.lineTo(dots[j].x, dots[j].y); ctx.stroke(); }
    }
  }
  dots.forEach(d => { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI*2); ctx.fillStyle = GOLD+"40"; ctx.fill(); });
}

function imgWrapText(ctx, text, x, y, maxW, lh) {
  const words = text.split(' '); let line = ''; let lines = [];
  for (let n = 0; n < words.length; n++) {
    const test = line + words[n] + ' ';
    if (ctx.measureText(test).width > maxW && n > 0) { lines.push(line.trim()); line = words[n]+' '; }
    else { line = test; }
  }
  lines.push(line.trim());
  lines.forEach((l, i) => ctx.fillText(l, x, y + i*lh));
  return lines.length;
}

/* ── Photo URL mapping by event type (multiple variants per category) ── */
const EVENT_PHOTO_VARIANTS = {
  training:    ["photos/training.png", "photos/training2.png", "photos/training3.png"],
  social:      ["photos/social.png", "photos/social2.png"],
  coworking:   ["photos/coworking.png", "photos/coworking2.png"],
  strategy:    ["photos/strategy.png", "photos/strategy2.png"],
  ama:         ["photos/ama.png", "photos/ama2.png"],
  celebration: ["photos/celebration.png"],
  realestate:  ["photos/realestate.png", "photos/realestate2.png"],
  poker:       ["photos/poker.png"],
};

/* simple string hash to deterministically pick a variant based on event title */
function hashTitle(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + ch;
    hash |= 0;
  }
  return Math.abs(hash);
}

function pickPhotoCategory(title, desc, host) {
  const text = `${title} ${desc} ${host}`.toLowerCase();
  if (/poker/i.test(text)) return "poker";
  if (/award|celebration|trophy|certificate/i.test(text)) return "celebration";
  if (/social|legacy|party|happy hour|fireside/i.test(text)) return "social";
  if (/meet.*work|co-?working|in-?person/i.test(text)) return "coworking";
  if (/101|201|301|102|training|mastering|course|class|learn|evaluating|contract|close|title/i.test(text)) return "training";
  if (/ask me|ama|q\s*&\s*a/i.test(text)) return "ama";
  if (/marketing|pipeline|strategy|brand|distribution/i.test(text)) return "strategy";
  if (/deal|property|house|invest|acquisition/i.test(text)) return "realestate";
  return "training";
}

function pickPhotoUrl(title, desc, host) {
  const category = pickPhotoCategory(title, desc, host);
  const variants = EVENT_PHOTO_VARIANTS[category];
  const idx = hashTitle(title) % variants.length;
  return variants[idx];
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("Failed to load: " + src));
    img.src = src;
  });
}

function drawBrandedOverlay(ctx, w, h, row) {
  /* dark gradient overlay at bottom */
  const grad = ctx.createLinearGradient(0, h * 0.35, 0, h);
  grad.addColorStop(0, "rgba(0,0,0,0)");
  grad.addColorStop(0.4, "rgba(0,0,0,0.45)");
  grad.addColorStop(1, "rgba(0,0,0,0.85)");
  ctx.fillStyle = grad; ctx.fillRect(0, 0, w, h);
  /* top gold bar */
  const bar = ctx.createLinearGradient(0, 0, w, 0);
  bar.addColorStop(0, GOLD_DARK); bar.addColorStop(0.5, GOLD); bar.addColorStop(1, GOLD_DARK);
  ctx.fillStyle = bar; ctx.fillRect(0, 0, w, 4);
  /* bottom gold bar */
  ctx.fillRect(0, h - 4, w, 4);
  drawGoldCorners(ctx, w, h, 35);
  /* day pill */
  const pillText = row.day.toUpperCase();
  ctx.font = "800 12px Helvetica, sans-serif";
  const pillW = ctx.measureText(pillText).width + 28;
  ctx.fillStyle = GOLD;
  ctx.beginPath(); ctx.roundRect(40, h - 150, pillW, 26, 13); ctx.fill();
  ctx.fillStyle = BLACK; ctx.textAlign = "left";
  ctx.fillText(pillText, 54, h - 132);
  /* time */
  ctx.font = "600 13px Helvetica, sans-serif";
  ctx.fillStyle = GOLD_LIGHT; ctx.textAlign = "left";
  ctx.fillText(row.time, 40 + pillW + 12, h - 132);
  /* title */
  ctx.font = "900 28px Georgia, serif"; ctx.fillStyle = "#ffffff";
  ctx.textAlign = "left";
  imgWrapText(ctx, row.title, 40, h - 95, w - 80, 34);
  /* brand */
  ctx.font = "800 9px Helvetica, sans-serif";
  ctx.fillStyle = GOLD + "88"; ctx.textAlign = "right";
  ctx.fillText("MYERS HOME BUYERS", w - 30, h - 18);
}

async function generateEventImage(row) {
  const canvas = document.createElement("canvas");
  canvas.width = IMG_GEN_W; canvas.height = IMG_GEN_H;
  const ctx = canvas.getContext("2d");
  const photoUrl = pickPhotoUrl(row.title, row.description, row.host);
  try {
    const img = await loadImage(photoUrl);
    /* draw photo to fill canvas (cover) */
    const scale = Math.max(IMG_GEN_W / img.width, IMG_GEN_H / img.height);
    const sw = IMG_GEN_W / scale, sh = IMG_GEN_H / scale;
    const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, IMG_GEN_W, IMG_GEN_H);
    /* add branded overlay */
    drawBrandedOverlay(ctx, IMG_GEN_W, IMG_GEN_H, row);
  } catch {
    /* fallback to canvas template if photo fails to load */
    const tmpl = pickTemplate(row.title, row.description, row.host);
    imgTemplates[tmpl](ctx, IMG_GEN_W, IMG_GEN_H, row);
  }
  return canvas.toDataURL("image/png");
}

const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

function getWeekRange(date) {
  const d = new Date(date);
  const dayOfWeek = d.getDay();
  const monday = new Date(d);
  monday.setDate(d.getDate() - ((dayOfWeek + 6) % 7));
  monday.setHours(0, 0, 0, 0);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  sunday.setHours(23, 59, 59, 999);
  return { start: monday, end: sunday };
}

function formatWeekLabel(start, end) {
  const opts = { month: "long", day: "numeric" };
  const startStr = start.toLocaleDateString("en-US", opts);
  const endStr = end.toLocaleDateString("en-US", { ...opts, year: "numeric" });
  return `Week of ${startStr} \u2013 ${endStr}`;
}

function formatEventTime(startStr, endStr) {
  const s = new Date(startStr);
  const e = new Date(endStr);
  const fmt = (d) => d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", hour12: true });
  return `${fmt(s)} \u2013 ${fmt(e)}`;
}

/* ───────── CALENDAR IMPORT MODAL ───────── */
function CalendarImportModal({ isOpen, onClose, onImport }) {
  const [step, setStep] = useState("loading"); // loading | pickCalendar | pickWeek | importing | error
  const [calendars, setCalendars] = useState([]);
  const [selectedCalendarId, setSelectedCalendarId] = useState("");
  const [selectedCalendarName, setSelectedCalendarName] = useState("");
  const [weekOffset, setWeekOffset] = useState(0); // 0 = this week, 1 = next week, etc.
  const [errorMsg, setErrorMsg] = useState("");
  const tokenClientRef = useRef(null);
  const gapiInitedRef = useRef(false);

  /* helper to get monday of a given week offset */
  const getWeekDates = (offset) => {
    const now = new Date();
    const shifted = new Date(now);
    shifted.setDate(now.getDate() + offset * 7);
    return getWeekRange(shifted);
  };

  const weekDates = getWeekDates(weekOffset);
  const weekLabel = formatWeekLabel(weekDates.start, weekDates.end);

  /* initialize GAPI and GIS */
  useEffect(() => {
    if (!isOpen) return;

    let cancelled = false;

    async function initGapi() {
      if (gapiInitedRef.current) {
        requestToken();
        return;
      }
      await new Promise((resolve, reject) => {
        if (typeof gapi === "undefined") {
          reject(new Error("Google API not loaded"));
          return;
        }
        gapi.load("client", { callback: resolve, onerror: reject });
      });
      await gapi.client.init({});
      await gapi.client.load(GCAL_DISCOVERY_DOC);
      gapiInitedRef.current = true;
      if (!cancelled) requestToken();
    }

    function requestToken() {
      if (typeof google === "undefined" || !google.accounts) {
        setStep("error");
        setErrorMsg("Google Identity Services not loaded. Please refresh and try again.");
        return;
      }
      tokenClientRef.current = google.accounts.oauth2.initTokenClient({
        client_id: GCAL_CLIENT_ID,
        scope: GCAL_SCOPES,
        callback: async (resp) => {
          if (resp.error) {
            setStep("error");
            setErrorMsg(`Auth error: ${resp.error}`);
            return;
          }
          /* fetch calendar list */
          try {
            const res = await gapi.client.calendar.calendarList.list();
            const cals = res.result.items || [];
            if (!cancelled) {
              setCalendars(cals);
              setStep("pickCalendar");
            }
          } catch (err) {
            if (!cancelled) {
              setStep("error");
              setErrorMsg("Failed to load calendars: " + (err.message || err));
            }
          }
        },
      });

      /* check if we already have a valid token */
      const token = gapi.client.getToken();
      if (token) {
        /* already signed in, just fetch calendars */
        (async () => {
          try {
            const res = await gapi.client.calendar.calendarList.list();
            const cals = res.result.items || [];
            if (!cancelled) {
              setCalendars(cals);
              setStep("pickCalendar");
            }
          } catch {
            tokenClientRef.current.requestAccessToken();
          }
        })();
      } else {
        tokenClientRef.current.requestAccessToken();
      }
    }

    setStep("loading");
    initGapi().catch((err) => {
      if (!cancelled) {
        setStep("error");
        setErrorMsg("Failed to initialize: " + (err.message || err));
      }
    });

    return () => { cancelled = true; };
  }, [isOpen]);

  /* fetch events for selected calendar + week */
  const handleImport = async () => {
    setStep("importing");
    try {
      const { start, end } = getWeekDates(weekOffset);
      const res = await gapi.client.calendar.events.list({
        calendarId: selectedCalendarId,
        timeMin: start.toISOString(),
        timeMax: end.toISOString(),
        singleEvents: true,
        orderBy: "startTime",
        maxResults: 50,
      });

      const events = (res.result.items || []).filter(
        (ev) => ev.start && (ev.start.dateTime || ev.start.date)
      );

      const rows = events.map((ev, i) => {
        const isAllDay = !ev.start.dateTime;
        const startDt = new Date(ev.start.dateTime || ev.start.date);
        const endDt = new Date(ev.end.dateTime || ev.end.date);
        const day = DAY_NAMES[startDt.getDay()];
        const time = isAllDay ? "All Day" : formatEventTime(ev.start.dateTime, ev.end.dateTime);

        return {
          id: Date.now() + i,
          day,
          time,
          title: ev.summary || "Untitled Event",
          host: ev.organizer?.displayName || ev.creator?.displayName || selectedCalendarName || "",
          description: ev.location
            ? (ev.description ? `${ev.location}\n${ev.description}` : ev.location)
            : (ev.description || ""),
          linkText: ev.hangoutLink ? "Join Google Meet" : "",
          linkUrl: ev.hangoutLink || "#",
          imageData: null,
        };
      });

      onImport(rows, formatWeekLabel(start, end));
      onClose();
    } catch (err) {
      setStep("error");
      setErrorMsg("Failed to fetch events: " + (err.message || err));
    }
  };

  if (!isOpen) return null;

  const overlayStyle = {
    position: "fixed", inset: 0, zIndex: 9999,
    background: "rgba(0,0,0,0.55)", backdropFilter: "blur(4px)",
    display: "flex", alignItems: "center", justifyContent: "center",
  };
  const modalStyle = {
    background: "#fff", borderRadius: 14, padding: "32px 28px",
    width: 440, maxWidth: "92vw", boxShadow: "0 20px 60px rgba(0,0,0,0.25)",
    position: "relative", fontFamily: "'DM Sans', sans-serif",
  };
  const headingStyle = {
    fontFamily: "'Playfair Display', serif", fontWeight: 900,
    fontSize: 22, color: BLACK, marginBottom: 6,
  };
  const subStyle = {
    fontSize: 13, color: "#888", marginBottom: 20, lineHeight: 1.5,
  };
  const btnPrimary = {
    background: `linear-gradient(135deg, ${GOLD_DARK}, ${GOLD})`,
    color: BLACK, border: "none", padding: "10px 24px", borderRadius: 8,
    fontWeight: 700, fontSize: 14, cursor: "pointer", letterSpacing: 0.5,
    width: "100%", marginTop: 8,
  };
  const btnSecondary = {
    background: "none", border: `1px solid #ddd`, padding: "8px 16px",
    borderRadius: 6, fontWeight: 600, fontSize: 12, cursor: "pointer",
    color: "#666", marginTop: 8,
  };
  const closeBtn = {
    position: "absolute", top: 14, right: 14, background: "none",
    border: "none", fontSize: 22, cursor: "pointer", color: "#aaa",
    lineHeight: 1,
  };

  return (
    <div style={overlayStyle} onClick={onClose}>
      <div style={modalStyle} onClick={(e) => e.stopPropagation()}>
        <button style={closeBtn} onClick={onClose}>×</button>

        {step === "loading" && (
          <div style={{ textAlign: "center", padding: "40px 0" }}>
            <div style={{
              width: 40, height: 40, border: `3px solid #eee`,
              borderTopColor: GOLD, borderRadius: "50%",
              animation: "spin 0.8s linear infinite", margin: "0 auto 16px",
            }} />
            <div style={{ color: "#888", fontSize: 14 }}>Connecting to Google Calendar...</div>
            <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
          </div>
        )}

        {step === "pickCalendar" && (
          <>
            <div style={headingStyle}>📅 Select Calendar</div>
            <div style={subStyle}>Choose which calendar to import events from.</div>
            <div style={{ maxHeight: 280, overflowY: "auto", marginBottom: 12 }}>
              {calendars.map((cal) => (
                <div
                  key={cal.id}
                  onClick={() => { setSelectedCalendarId(cal.id); setSelectedCalendarName(cal.summary); }}
                  style={{
                    padding: "12px 14px", borderRadius: 8, cursor: "pointer",
                    marginBottom: 6, transition: "all 0.15s",
                    border: selectedCalendarId === cal.id ? `2px solid ${GOLD}` : "2px solid #f0eee8",
                    background: selectedCalendarId === cal.id ? `${GOLD}11` : "#faf8f4",
                    display: "flex", alignItems: "center", gap: 10,
                  }}
                >
                  <div style={{
                    width: 14, height: 14, borderRadius: 3, flexShrink: 0,
                    background: cal.backgroundColor || GOLD,
                  }} />
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14, color: BLACK }}>{cal.summary}</div>
                    {cal.description && (
                      <div style={{ fontSize: 11, color: "#999", marginTop: 2 }}>{cal.description}</div>
                    )}
                  </div>
                </div>
              ))}
            </div>
            <button
              style={{ ...btnPrimary, opacity: selectedCalendarId ? 1 : 0.4 }}
              disabled={!selectedCalendarId}
              onClick={() => setStep("pickWeek")}
            >
              Continue →
            </button>
          </>
        )}

        {step === "pickWeek" && (
          <>
            <div style={headingStyle}>📆 Select Week</div>
            <div style={subStyle}>
              Importing from: <strong>{selectedCalendarName}</strong>
            </div>
            <div style={{
              display: "flex", alignItems: "center", justifyContent: "center",
              gap: 16, padding: "20px 0",
            }}>
              <button
                onClick={() => setWeekOffset((w) => w - 1)}
                style={{ ...btnSecondary, fontSize: 18, padding: "4px 14px", marginTop: 0 }}
              >
                ←
              </button>
              <div style={{ textAlign: "center", minWidth: 200 }}>
                <div style={{ fontWeight: 800, fontSize: 15, color: BLACK }}>{weekLabel}</div>
                <div style={{ fontSize: 11, color: "#aaa", marginTop: 4 }}>
                  {weekOffset === 0 ? "This week" : weekOffset === 1 ? "Next week" : weekOffset === -1 ? "Last week" : `${Math.abs(weekOffset)} weeks ${weekOffset > 0 ? "from now" : "ago"}`}
                </div>
              </div>
              <button
                onClick={() => setWeekOffset((w) => w + 1)}
                style={{ ...btnSecondary, fontSize: 18, padding: "4px 14px", marginTop: 0 }}
              >
                →
              </button>
            </div>
            <button style={btnPrimary} onClick={handleImport}>
              📅 Import Events
            </button>
            <button
              style={{ ...btnSecondary, width: "100%", textAlign: "center" }}
              onClick={() => setStep("pickCalendar")}
            >
              ← Back to calendar list
            </button>
          </>
        )}

        {step === "importing" && (
          <div style={{ textAlign: "center", padding: "40px 0" }}>
            <div style={{
              width: 40, height: 40, border: `3px solid #eee`,
              borderTopColor: GOLD, borderRadius: "50%",
              animation: "spin 0.8s linear infinite", margin: "0 auto 16px",
            }} />
            <div style={{ color: "#888", fontSize: 14 }}>Fetching events for {weekLabel}...</div>
            <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
          </div>
        )}

        {step === "error" && (
          <>
            <div style={headingStyle}>⚠️ Something went wrong</div>
            <div style={{ ...subStyle, color: "#c44" }}>{errorMsg}</div>
            <button style={btnPrimary} onClick={onClose}>Close</button>
          </>
        )}
      </div>
    </div>
  );
}

/* ───────── IMAGE UPLOAD BOX (with Drag & Drop) ───────── */
function ImageUpload({ imageData, onUpload, label }) {
  const ref = useRef();
  const [isDragging, setIsDragging] = useState(false);

  const handle = async (e) => {
    const f = e.target.files?.[0];
    if (f) onUpload(await readFileAsDataURL(f));
  };
  
  const handleDragOver = (e) => {
    e.preventDefault();
    setIsDragging(true);
  };
  
  const handleDragLeave = () => {
    setIsDragging(false);
  };
  
  const handleDrop = async (e) => {
    e.preventDefault();
    setIsDragging(false);
    const f = e.dataTransfer.files?.[0];
    if (f && f.type.startsWith('image/')) onUpload(await readFileAsDataURL(f));
  };

  return (
    <div
      onClick={() => ref.current.click()}
      onDragOver={handleDragOver}
      onDragLeave={handleDragLeave}
      onDrop={handleDrop}
      style={{
        width: "100%",
        height: 120,
        borderRadius: 8,
        border: `2px dashed ${imageData ? GOLD : (isDragging ? GOLD_DARK : "#ccc")}`,
        display: "flex",
        alignItems: "center",
        justifyContent: "center",
        cursor: "pointer",
        overflow: "hidden",
        background: imageData ? "none" : (isDragging ? "#fefdfa" : "#faf8f4"),
        position: "relative",
        transition: "all 0.2s ease"
      }}
    >
      {imageData ? (
        <img
          src={imageData}
          alt=""
          style={{ width: "100%", height: "100%", objectFit: "cover" }}
        />
      ) : (
        <span style={{ color: "#999", fontSize: 13, textAlign: "center", padding: 8 }}>
          {isDragging ? "📷 Drop image here" : (label || "📷 Click or drag image to upload")}
        </span>
      )}
      <input
        ref={ref}
        type="file"
        accept="image/*"
        onChange={handle}
        style={{ display: "none" }}
      />
    </div>
  );
}

/* ───────── GENERATE EMAIL HTML ───────── */
function generateEmailHTML({ logoData, dateRange, rows, footer }) {
  const EMAIL_W = 600;
  const IMG_W = 250;
  const TEXT_W = 350;

  const rowsHTML = rows
    .map((row, i) => {

        : `<td width="${IMG_W}" style="width:${IMG_W}px;padding:0;vertical-align:top;background-color:#f5f0e6;height:260px;"></td>`;

      const borderSide = reversed ? "border-right" : "border-left";
      const textCell = `<td width="${TEXT_W}" style="width:${TEXT_W}px;padding:24px;vertical-align:middle;${borderSide}:4px solid ${GOLD};">
        <div style="font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:4px;color:${GOLD_DARK};margin-bottom:4px;font-family:Georgia,serif;border-bottom:3px solid #D4A84344;padding-bottom:4px;">${row.day}</div>
        <div style="font-weight:700;font-size:12px;color:${GOLD_DARK};margin-bottom:8px;">${row.time}</div>
        <div style="font-weight:900;font-size:18px;line-height:1.25;color:${BLACK};margin-bottom:8px;font-family:Georgia,serif;">${row.title}</div>
        <div style="font-weight:700;font-size:12px;color:#1a1a1a;margin-bottom:6px;">${row.host}</div>
        <div style="font-size:13px;line-height:1.6;color:#3d3d3d;margin-bottom:10px;">${row.description}</div>
        ${row.linkText ? `<a href="${row.linkUrl || "#"}" style="font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:${GOLD_DARK};text-decoration:none;">${row.linkText} &rarr;</a>` : ""}
      </td>`;
      const cells = reversed ? textCell + imgCell : imgCell + textCell;
      return `<tr><td style="padding:0;"><table width="${EMAIL_W}" cellpadding="0" cellspacing="0" style="border-bottom:1px solid #edebe6;"><tr>${cells}</tr></table></td></tr>`;
    })
    .join("\n");

  return `<html>
<head><meta charset="UTF-8"></head>
<body style="margin:0;padding:0;background-color:#faf8f4;font-family:Helvetica,Arial,sans-serif;">
<table width="${EMAIL_W}" cellpadding="0" cellspacing="0" align="center" style="background-color:#ffffff;">
  <tr><td style="padding:16px 24px;border-bottom:3px solid ${GOLD};background-color:#ffffff;">
    <table width="100%" cellpadding="0" cellspacing="0"><tr>
      <td style="vertical-align:middle;">${logoData ? `<img src="${logoData}" alt="Myers Home Buyers" height="46" style="height:46px;width:auto;display:block;" />` : `<span style="font-family:Georgia,serif;font-weight:900;font-size:20px;color:${BLACK};">Myers <span style="color:${GOLD};">Home Buyers</span></span>`}</td>
      <td style="text-align:right;vertical-align:middle;"><span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#7a7a7a;">Weekly Newsletter</span></td>
    </tr></table>
  </td></tr>
  <tr><td style="background-color:${GOLD};text-align:center;padding:12px 24px;font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:3px;color:${BLACK};">${dateRange}</td></tr>
  ${rowsHTML}
  <tr><td style="background-color:${BLACK};padding:20px 24px;border-top:3px solid ${GOLD};">
    <table width="100%" cellpadding="0" cellspacing="0"><tr>
      <td style="color:#cccccc;font-size:12px;">Phone: ${footer.phone}</td>
      <td style="color:#cccccc;font-size:12px;text-align:center;">${footer.website}</td>
      <td style="color:#cccccc;font-size:12px;text-align:right;">${footer.email}</td>
    </tr></table>
  </td></tr>
</table>
</body></html>`;
}

/* ═══════════════ MAIN APP ═══════════════ */
function NewsletterBuilder() {
  const [tab, setTab] = useState("edit");
  const [logoData, setLogoData] = useState(null);
  const [dateRange, setDateRange] = useState("Week of May 4 \u2013 May 8, 2026");
  const [rows, setRows] = useState(defaultRows);
  const [footer, setFooter] = useState(defaultFooter);
  const [copied, setCopied] = useState(false);
  const [copiedCode, setCopiedCode] = useState(false);
  const [draggedId, setDraggedId] = useState(null);
  const [dragOverId, setDragOverId] = useState(null);
  const [calModalOpen, setCalModalOpen] = useState(false);
  const previewRef = useRef();
  let nextId = useRef(10);

  const updateRow = (id, updated) =>
    setRows((r) => r.map((row) => (row.id === id ? updated : row)));
  const removeRow = (id) => setRows((r) => r.filter((row) => row.id !== id));
  const duplicateRow = (id) => {
    setRows((r) => {
      const idx = r.findIndex((row) => row.id === id);
      if (idx === -1) return r;
      const clone = { ...r[idx], id: nextId.current++, imageData: r[idx].imageData };
      const newRows = [...r];
      newRows.splice(idx + 1, 0, clone);
      return newRows;
    });
  };

  /* ── Calendar import handler ── */
  const handleCalendarImport = (importedRows, weekLabel) => {
    setRows(importedRows);
    setDateRange(weekLabel);
    setTab("edit");
  };

  /* ── Auto-generate images for all events ── */
  const handleGenerateImages = async () => {
    const updated = await Promise.all(
      rows.map(async (row) => ({
        ...row,
        imageData: row.imageData || (await generateEventImage(row)),
      }))
    );
    setRows(updated);
  };

  const handleRegenerateAllImages = async () => {
    const updated = await Promise.all(
      rows.map(async (row) => ({
        ...row,
        imageData: await generateEventImage(row),
      }))
    );
    setRows(updated);
  };

  const addRow = () => {
    setRows((r) => [
      ...r,
      {
        id: nextId.current++,
        day: "Day",
        time: "Time",
        title: "Event Title",
        host: "Host",
        description: "Event description goes here.",
        linkText: "Learn More",
        linkUrl: "#",
        imageData: null,
      },
    ]);
  };

  /* ── Drag-and-drop handlers ── */
  const handleDragStart = (id) => (e) => {
    setDraggedId(id);
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", id);
    e.currentTarget.style.opacity = "0.4";
  };
  const handleDragOver = (id) => (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    setDragOverId(id);
  };
  const handleDrop = (targetId) => (e) => {
    e.preventDefault();
    if (draggedId == null || draggedId === targetId) {
      setDraggedId(null);
      setDragOverId(null);
      return;
    }
    setRows((prev) => {
      const arr = [...prev];
      const fromIdx = arr.findIndex((r) => r.id === draggedId);
      const toIdx = arr.findIndex((r) => r.id === targetId);
      const [moved] = arr.splice(fromIdx, 1);
      arr.splice(toIdx, 0, moved);
      return arr;
    });
    setDraggedId(null);
    setDragOverId(null);
  };
  const handleDragEnd = (e) => {
    e.currentTarget.style.opacity = "1";
    setDraggedId(null);
    setDragOverId(null);
  };

  const handleCopyRendered = useCallback(async () => {
    try {
      const html = generateEmailHTML({ logoData, dateRange, rows, footer });
      await navigator.clipboard.write([
        new ClipboardItem({ "text/html": new Blob([html], { type: "text/html" }) }),
      ]);
      setCopied(true);
      setTimeout(() => setCopied(false), 2500);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = generateEmailHTML({ logoData, dateRange, rows, footer });
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      setCopiedCode(true);
      setTimeout(() => setCopiedCode(false), 2500);
    }
  }, [logoData, dateRange, rows, footer]);

  const handleCopyCode = useCallback(() => {
    const html = generateEmailHTML({ logoData, dateRange, rows, footer });
    const ta = document.createElement("textarea");
    ta.value = html;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    setCopiedCode(true);
    setTimeout(() => setCopiedCode(false), 2500);
  }, [logoData, dateRange, rows, footer]);

  return (
    <div
      style={{
        minHeight: "100vh",
        background: "#f5f3ee",
        fontFamily: "'DM Sans', sans-serif",
      }}
    >
      <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet"
      />

      {/* ── TOP BAR ── */}
      <div
        style={{
          background: "#ffffff",
          padding: "16px 24px",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          borderBottom: `3px solid ${GOLD}`,
          position: "sticky",
          top: 0,
          zIndex: 100,
        }}
      >
        <div style={{ display: "flex", alignItems: "center" }}>
          <img
            src="myers-logo.png"
            alt="Myers Home Buyers"
            style={{ height: 36, width: "auto" }}
          />
          <span
            style={{
              fontFamily: "'DM Sans', sans-serif",
              fontWeight: 700,
              fontSize: 16,
              color: "#aaa",
              marginLeft: 12,
              paddingLeft: 12,
              borderLeft: "2px solid #eee",
            }}
          >
            Newsletter Builder
          </span>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button
            onClick={() => setCalModalOpen(true)}
            style={{
              background: "none",
              color: GOLD_DARK,
              border: `1px solid ${GOLD}`,
              padding: "8px 16px",
              borderRadius: 6,
              fontWeight: 700,
              fontSize: 13,
              cursor: "pointer",
              letterSpacing: 0.5,
              transition: "all 0.15s",
            }}
            onMouseEnter={(e) => { e.target.style.background = GOLD; e.target.style.color = BLACK; }}
            onMouseLeave={(e) => { e.target.style.background = 'none'; e.target.style.color = GOLD_DARK; }}
          >
            📅 Import Calendar
          </button>
          <button
            onClick={(e) => { if (e.shiftKey) handleRegenerateAllImages(); else handleGenerateImages(); }}
            style={{
              background: "none",
              color: GOLD_DARK,
              border: `1px solid ${GOLD}`,
              padding: "8px 16px",
              borderRadius: 6,
              fontWeight: 700,
              fontSize: 13,
              cursor: "pointer",
              letterSpacing: 0.5,
              transition: "all 0.15s",
            }}
            onMouseEnter={(e) => { e.target.style.background = GOLD; e.target.style.color = BLACK; }}
            onMouseLeave={(e) => { e.target.style.background = 'none'; e.target.style.color = GOLD_DARK; }}
            title="Generate pro images for empty slots. Shift+Click to regenerate ALL."
          >
            🎨 Generate Images
          </button>
          <button
            onClick={handleCopyRendered}
            style={{
              background: `linear-gradient(135deg, ${GOLD_DARK}, ${GOLD})`,
              color: BLACK,
              border: "none",
              padding: "8px 20px",
              borderRadius: 6,
              fontWeight: 700,
              fontSize: 13,
              cursor: "pointer",
              letterSpacing: 0.5,
            }}
          >
            {copied ? "✓ Copied!" : "📋 Copy for Email"}
          </button>
          <button
            onClick={handleCopyCode}
            style={{
              background: "transparent",
              color: "#aaa",
              border: `1px solid #444`,
              padding: "8px 16px",
              borderRadius: 6,
              fontWeight: 600,
              fontSize: 12,
              cursor: "pointer",
            }}
          >
            {copiedCode ? "✓ Copied!" : "{ } HTML Code"}
          </button>
        </div>
      </div>

      {/* ── TABS ── */}
      <div
        style={{
          display: "flex",
          justifyContent: "center",
          gap: 0,
          padding: "16px 24px 0",
        }}
      >
        {["edit", "preview"].map((t) => (
          <button
            key={t}
            onClick={() => setTab(t)}
            style={{
              padding: "10px 32px",
              border: "none",
              borderBottom: tab === t ? `3px solid ${GOLD}` : "3px solid transparent",
              background: tab === t ? "#fff" : "transparent",
              fontWeight: 700,
              fontSize: 13,
              textTransform: "uppercase",
              letterSpacing: 2,
              color: tab === t ? BLACK : "#999",
              cursor: "pointer",
              transition: "all 0.2s",
              borderRadius: "8px 8px 0 0",
            }}
          >
            {t === "edit" ? "✏️ Editor" : "👁 Preview"}
          </button>
        ))}
      </div>

      {/* ── CONTENT ── */}
      <div style={{ maxWidth: 640, margin: "0 auto", padding: "20px 16px 60px" }}>
        {tab === "edit" ? (
          <>
            {/* Header settings */}
            <div
              style={{
                background: "#fff",
                border: "1px solid #e8e5df",
                borderRadius: 10,
                padding: 20,
                marginBottom: 16,
              }}
            >
              <span
                style={{
                  fontSize: 12,
                  fontWeight: 800,
                  textTransform: "uppercase",
                  letterSpacing: 2,
                  color: GOLD_DARK,
                  display: "block",
                  marginBottom: 14,
                }}
              >
                Header
              </span>
              <div style={{ display: "flex", gap: 16, alignItems: "flex-start" }}>
                <div style={{ width: 160, flexShrink: 0 }}>
                  <ImageUpload
                    imageData={logoData}
                    onUpload={setLogoData}
                    label="📷 Upload logo"
                  />
                </div>
                <div style={{ flex: 1 }}>
                  <Field
                    label="Date Range"
                    value={dateRange}
                    onChange={setDateRange}
                  />
                </div>
              </div>
            </div>

            {/* Event rows */}
            {rows.map((row, i) => (
              <RowEditor
                key={row.id}
                row={row}
                index={i}
                total={rows.length}
                onChange={(updated) => updateRow(row.id, updated)}
                onRemove={() => removeRow(row.id)}
                onDuplicate={() => duplicateRow(row.id)}
                isDragOver={dragOverId === row.id}
                onDragStart={handleDragStart(row.id)}
                onDragOver={handleDragOver(row.id)}
                onDragEnd={handleDragEnd}
                onDrop={handleDrop(row.id)}
              />
            ))}

            <button
              onClick={addRow}
              style={{
                width: "100%",
                padding: "14px",
                border: `2px dashed #ccc`,
                borderRadius: 10,
                background: "none",
                fontWeight: 700,
                fontSize: 14,
                color: "#999",
                cursor: "pointer",
                marginBottom: 16,
              }}
            >
              + Add Event Row
            </button>

            {/* Footer settings */}
            <div
              style={{
                background: "#fff",
                border: "1px solid #e8e5df",
                borderRadius: 10,
                padding: 20,
              }}
            >
              <span
                style={{
                  fontSize: 12,
                  fontWeight: 800,
                  textTransform: "uppercase",
                  letterSpacing: 2,
                  color: GOLD_DARK,
                  display: "block",
                  marginBottom: 14,
                }}
              >
                Footer
              </span>
              <div style={{ display: "flex", gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <Field
                    label="Phone"
                    value={footer.phone}
                    onChange={(v) => setFooter({ ...footer, phone: v })}
                    small
                  />
                </div>
                <div style={{ flex: 1 }}>
                  <Field
                    label="Website"
                    value={footer.website}
                    onChange={(v) => setFooter({ ...footer, website: v })}
                    small
                  />
                </div>
                <div style={{ flex: 1 }}>
                  <Field
                    label="Email"
                    value={footer.email}
                    onChange={(v) => setFooter({ ...footer, email: v })}
                    small
                  />
                </div>
              </div>
            </div>
          </>
        ) : (
          /* ── PREVIEW TAB ── */
          <div
            ref={previewRef}
            style={{
              maxWidth: 600,
              margin: "0 auto",
              background: "#fff",
              boxShadow: "0 4px 40px rgba(0,0,0,0.06)",
              borderRadius: 4,
              overflow: "hidden",
            }}
          >
            {/* Header */}
            <div
              style={{
                display: "flex",
                alignItems: "center",
                justifyContent: "space-between",
                padding: "16px 24px",
                borderBottom: `3px solid ${GOLD}`,
              }}
            >
              <div>
                {logoData ? (
                  <img
                    src={logoData}
                    alt="Logo"
                    style={{ height: 46, width: "auto" }}
                  />
                ) : (
                  <span
                    style={{
                      fontFamily: "'Playfair Display', serif",
                      fontWeight: 900,
                      fontSize: 20,
                      color: BLACK,
                    }}
                  >
                    Myers{" "}
                    <span style={{ color: GOLD }}>Home Buyers</span>
                  </span>
                )}
              </div>
              <span
                style={{
                  fontSize: 11,
                  fontWeight: 700,
                  textTransform: "uppercase",
                  letterSpacing: 2,
                  color: "#7a7a7a",
                }}
              >
                Weekly Newsletter
              </span>
            </div>

            {/* Date banner */}
            <div
              style={{
                background: GOLD,
                textAlign: "center",
                padding: "12px 24px",
                fontWeight: 700,
                fontSize: 12,
                textTransform: "uppercase",
                letterSpacing: 3,
                color: BLACK,
              }}
            >
              {dateRange}
            </div>

            {/* Event rows */}
            {rows.map((row, i) => (
              <PreviewRow key={row.id} row={row} index={i} />
            ))}

            {/* Footer */}
            <div
              style={{
                background: BLACK,
                padding: "20px 24px",
                display: "flex",
                justifyContent: "space-between",
                borderTop: `3px solid ${GOLD}`,
              }}
            >
              <span style={{ color: "#ccc", fontSize: 12 }}>📞 {footer.phone}</span>
              <span style={{ color: "#ccc", fontSize: 12 }}>🌐 {footer.website}</span>
              <span style={{ color: "#ccc", fontSize: 12 }}>✉️ {footer.email}</span>
            </div>
          </div>
        )}
      </div>

      {/* ── Calendar Import Modal ── */}
      <CalendarImportModal
        isOpen={calModalOpen}
        onClose={() => setCalModalOpen(false)}
        onImport={handleCalendarImport}
      />
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<NewsletterBuilder />);
  </script>
</body>
</html>
